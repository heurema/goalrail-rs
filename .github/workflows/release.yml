name: build release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Planned stable version (X.Y.Z)
        required: true
        type: string
      source_commit:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: goalrail-release-candidate-v${{ inputs.version }}
  cancel-in-progress: true

jobs:
  resolve:
    name: resolve exact candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      rust_toolchain: ${{ steps.source.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
      - id: source
        name: Resolve commit, version, and toolchain
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"${REQUESTED_VERSION}"; then
            echo "version must use X.Y.Z" >&2
            exit 1
          fi
          if ! grep -Eq '^[0-9a-f]{40}$' <<<"${REQUESTED_COMMIT}"; then
            echo "source commit must be a full Git SHA" >&2
            exit 1
          fi
          [[ "${WORKFLOW_COMMIT}" == "${REQUESTED_COMMIT}" ]]

          source_commit="$(git rev-parse HEAD)"
          [[ "${source_commit}" == "${REQUESTED_COMMIT}" ]]

          package_id="$(cargo pkgid -p gr)"
          version="${package_id##*@}"
          [[ "${version}" == "${REQUESTED_VERSION}" ]]
          tag="v${version}"
          ./scripts/check-remote-release-tag-absent.sh "${tag}" origin

          rust_toolchain="$(awk -F'"' '/^rust = / { print $2 }' mise.toml)"
          [[ -n "${rust_toolchain}" ]]

          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "source_commit=${source_commit}" >>"${GITHUB_OUTPUT}"
          echo "rust_toolchain=${rust_toolchain}" >>"${GITHUB_OUTPUT}"

  verify:
    name: verify exact candidate tree
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
      - name: Verify the selected source commit
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_COMMIT}" ]]
      - name: Install the pinned Rust toolchain
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal \
            --component clippy --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"
      - name: Run the canonical candidate source gate
        shell: bash
        run: ./scripts/check-release-candidate.sh

  build:
    name: build ${{ matrix.target }}
    needs: [resolve, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
      - name: Verify the selected source commit
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_COMMIT}" ]]
      - name: Install the pinned Rust toolchain
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - name: Build, run, package, and verify the native binary
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ./scripts/prepare-release.sh "${VERSION}" "${TARGET}" dist
          ./scripts/check-release.sh "${VERSION}" "${TARGET}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goalrail-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}
          path: dist/${{ needs.resolve.outputs.tag }}/goalrail-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: assemble verified release candidate
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: goalrail-${{ needs.resolve.outputs.tag }}-*
          path: dist/${{ needs.resolve.outputs.tag }}
          merge-multiple: true
      - name: Verify tag absence and assemble the candidate
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_COMMIT}" ]]
          ./scripts/check-remote-release-tag-absent.sh "${TAG}" origin
          command -v ruby >/dev/null
          ./scripts/assemble-release.sh \
            "${VERSION}" "${SOURCE_COMMIT}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" \
            "${GITHUB_WORKFLOW}" "${GITHUB_EVENT_NAME}" "${GITHUB_REF_NAME}" dist
          ./scripts/check-release-bundle.sh \
            "${VERSION}" "${SOURCE_COMMIT}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goalrail-${{ needs.resolve.outputs.tag }}-release-candidate
          path: |
            dist/${{ needs.resolve.outputs.tag }}/*.tar.gz
            dist/${{ needs.resolve.outputs.tag }}/*.sha256
            dist/${{ needs.resolve.outputs.tag }}/goalrail-${{ needs.resolve.outputs.tag }}-*.json
            dist/${{ needs.resolve.outputs.tag }}/goalrail.rb
            dist/${{ needs.resolve.outputs.tag }}/release.json
          if-no-files-found: error
          retention-days: 14
      - name: Write the candidate receipt
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          echo "Release candidate READY_FOR_TAG: ${TAG} from ${SOURCE_COMMIT}." >>"${GITHUB_STEP_SUMMARY}"
          echo "This workflow did not create a tag, GitHub Release, branch update, or Homebrew change." >>"${GITHUB_STEP_SUMMARY}"
