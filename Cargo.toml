[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.10"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = "4"
gr-inspect-claude = { path = "crates/gr-inspect-claude" }
gr-inspect-codex = { version = "0.3.10", path = "crates/gr-inspect-codex" }
gr-inspect-core = { path = "crates/gr-inspect-core" }
gr-skill-assessment = { path = "crates/gr-skill-assessment" }
memchr = "2"
serde = { version = "1", default-features = false }
serde_json = "1"
semver = "1"
toml = "1.1.4"
