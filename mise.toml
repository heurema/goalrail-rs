min_version = "2025.8.11"

[tools]
rust = "1.97.1"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"

[tasks.setup]
description = "Install pinned tools and the pre-push hook"
run = [
  "mise install",
  "rustup component add llvm-tools-preview",
  "./scripts/install-git-hooks.sh",
]

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.coverage]
description = "Run tests and report workspace coverage"
run = "cargo llvm-cov --workspace --summary-only"

[tasks.ci]
description = "Run the local CI checks"
run = [
  { task = "fmt" },
  { task = "lint" },
  { task = "coverage" },
  { task = "test:verification-receipts" },
]

[tasks."mutants:diff"]
description = "Run mutation tests only for code overlapping a goal-scoped diff"
run = '''
if [ -z "${GOALRAIL_MUTATION_DIFF:-}" ]; then
  echo "GOALRAIL_MUTATION_DIFF must point to a goal-scoped unified diff" >&2
  exit 2
fi
if [ ! -s "$GOALRAIL_MUTATION_DIFF" ]; then
  echo "GOALRAIL_MUTATION_DIFF is missing or empty: $GOALRAIL_MUTATION_DIFF" >&2
  exit 2
fi
cargo mutants --workspace --in-diff "$GOALRAIL_MUTATION_DIFF" --output target/mutants-diff
'''

[tasks."verify:rust-milestone"]
description = "Verify a goal-scoped Rust milestone and record a local receipt"
run = './scripts/rust-verification-receipts.sh verify-milestone "$GOALRAIL_MUTATION_DIFF"'

[tasks."verify:outgoing-rust"]
description = "Verify an already committed outgoing Rust range before push"
run = './scripts/rust-verification-receipts.sh verify-outgoing "$@"'

[tasks."verify:ci-state"]
description = "Run CI for a no-Rust-change edge and record the exact tree"
run = './scripts/rust-verification-receipts.sh verify-ci "$@"'

[tasks."test:verification-receipts"]
description = "Test local Rust verification receipt behavior"
run = "./scripts/test-rust-verification-receipts.sh"

[tasks."site:build"]
description = "Build the static Goalrail site and its WebAssembly motion module"
run = "./scripts/build-site.sh"

[tasks."site:test"]
description = "Test the Goalrail site motion module on the host"
run = "cargo test -p gr-site"

[tasks."release:prepare"]
description = "Build local macOS arm64 release artifacts"
run = "./scripts/prepare-release.sh"

[tasks."release:check"]
description = "Verify local release artifacts and Homebrew formula"
run = "./scripts/check-release.sh"

[tasks."release:preflight"]
description = "Check public release source prerequisites without publishing"
run = "./scripts/release-preflight.sh"

[tasks."release:test"]
description = "Exercise local release packaging in a temporary directory"
run = "./scripts/test-release-tooling.sh"

[tasks."mutants:full"]
description = "Run the full mutation suite for deep CI"
run = "cargo mutants --workspace --output target/mutants-full"
