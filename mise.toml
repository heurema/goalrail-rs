min_version = "2025.8.11"

[tools]
rust = "1.97.1"
prek = "0.4.12"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"

[tasks.setup]
description = "Install pinned tools and the pre-push hook"
run = [
  "mise install",
  "rustup component add llvm-tools-preview",
  "prek install",
]

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.coverage]
description = "Run tests and report workspace coverage"
run = "cargo llvm-cov --workspace --summary-only"

[tasks.ci]
description = "Run the local CI checks"
run = [
  { task = "fmt" },
  { task = "lint" },
  { task = "coverage" },
]

[tasks."site:build"]
description = "Build the static Goalrail site and its WebAssembly motion module"
run = "./scripts/build-site.sh"

[tasks."site:test"]
description = "Test the Goalrail site motion module on the host"
run = "cargo test -p gr-site"

[tasks."release:prepare"]
description = "Build local macOS arm64 release artifacts"
run = "./scripts/prepare-release.sh"

[tasks."release:check"]
description = "Verify local release artifacts and Homebrew formula"
run = "./scripts/check-release.sh"

[tasks."release:preflight"]
description = "Check public release source prerequisites without publishing"
run = "./scripts/release-preflight.sh"

[tasks."release:test"]
description = "Exercise local release packaging in a temporary directory"
run = "./scripts/test-release-tooling.sh"

[tasks."mutants:full"]
description = "Run the full mutation suite for deep CI"
run = "cargo mutants --workspace --output target/mutants-full"
