min_version = "2025.8.11"

[tools]
rust = "1.97.1"
jq = "1.8.2"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-public-api" = "0.52.0"

[tasks.setup]
description = "Install pinned tools and the pre-push hook"
run = [
  "mise install",
  "rustup toolchain install nightly-2026-08-07 --profile minimal",
  "rustup component add llvm-tools-preview",
  "./scripts/install-git-hooks.sh",
]

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.coverage]
description = "Run tests and report workspace coverage"
run = "cargo llvm-cov --workspace --summary-only"

[tasks.ci]
description = "Run the local CI checks"
run = [
  { task = "fmt" },
  { task = "lint" },
  { task = "architecture:assessment" },
  { task = "test:assessment-boundary" },
  { task = "test:goalrail-plugin" },
  { task = "test:homebrew-update-state" },
  { task = "release:test" },
  { task = "coverage" },
  { task = "test:verification-receipts" },
]

[tasks."mutants:diff"]
description = "Run mutation tests only for code overlapping a goal-scoped diff"
run = '''
if [ -z "${GOALRAIL_MUTATION_DIFF:-}" ]; then
  echo "GOALRAIL_MUTATION_DIFF must point to a goal-scoped unified diff" >&2
  exit 2
fi
if [ ! -s "$GOALRAIL_MUTATION_DIFF" ]; then
  echo "GOALRAIL_MUTATION_DIFF is missing or empty: $GOALRAIL_MUTATION_DIFF" >&2
  exit 2
fi
cargo mutants --workspace --in-diff "$GOALRAIL_MUTATION_DIFF" --output target/mutants-diff
'''

[tasks."verify:rust-milestone"]
description = "Verify a goal-scoped Rust milestone and record a local receipt"
run = './scripts/rust-verification-receipts.sh verify-milestone "$GOALRAIL_MUTATION_DIFF"'

[tasks."verify:outgoing-rust"]
description = "Verify an already committed outgoing Rust range before push"
run = './scripts/rust-verification-receipts.sh verify-outgoing "$@"'

[tasks."verify:ci-state"]
description = "Run CI for a no-Rust-change edge and record the exact tree"
run = './scripts/rust-verification-receipts.sh verify-ci "$@"'

[tasks."test:verification-receipts"]
description = "Test local Rust verification receipt behavior"
run = "./scripts/test-rust-verification-receipts.sh"

[tasks."architecture:public-api"]
description = "Compare the Rust facade with the accepted public API snapshot"
run = "./scripts/check-public-api.sh"

[tasks."test:public-api"]
description = "Test the public API trial fail-closed behavior"
run = "./scripts/test-public-api.sh"

[tasks."architecture:drift"]
description = "Report identity-based architecture drift from the accepted baseline"
run = "./scripts/architecture-drift.sh check"

[tasks."architecture:drift:capture"]
description = "Print the current architecture drift snapshot without accepting it"
run = "./scripts/architecture-drift.sh capture"

[tasks."test:architecture-drift"]
description = "Sabotage-test the advisory architecture drift trial"
run = "./scripts/test-architecture-drift.sh"

[tasks."architecture:assessment"]
description = "Verify the compiler-enforced skill assessment boundary"
run = "./scripts/check-assessment-boundary.sh"

[tasks."test:assessment-boundary"]
description = "Sabotage-test the skill assessment boundary gate"
run = "./scripts/test-assessment-boundary.sh"

[tasks."test:goalrail-plugin"]
description = "Validate the repo marketplace and Goalrail Codex plugin package"
run = "./scripts/test-goalrail-plugin.sh"

[tasks."test:homebrew-update-state"]
description = "Sabotage-test the bundled Homebrew update-state normalizer"
run = "./scripts/test-homebrew-update-state.sh"

[tasks."smoke:goalrail-plugin-remote"]
description = "Install the Goalrail plugin from a remote Git ref in an isolated Codex profile"
run = "./scripts/smoke-goalrail-plugin-remote.sh"

[tasks."site:build"]
description = "Build the static Goalrail site and its WebAssembly motion module"
run = "./scripts/build-site.sh"

[tasks."site:test"]
description = "Test the Goalrail site motion module on the host"
run = "cargo test -p gr-site"

[tasks."release:prepare"]
description = "Build and package one native release target"
run = "./scripts/prepare-release.sh"

[tasks."release:check"]
description = "Verify one packaged release target"
run = "./scripts/check-release.sh"

[tasks."release:assemble"]
description = "Assemble a three-target bundle with explicit workflow run identity"
run = "./scripts/assemble-release.sh"

[tasks."release:bundle-check"]
description = "Verify an assembled three-target release bundle"
run = "./scripts/check-release-bundle.sh"

[tasks."release:preflight"]
description = "Check pre-tag release candidate prerequisites"
run = "./scripts/release-preflight.sh"

[tasks."release:candidate-check"]
description = "Run the exact source gate used by the native candidate workflow"
run = "./scripts/check-release-candidate.sh"

[tasks."release:run-check"]
description = "Verify one exact successful GitHub Actions candidate run"
run = "./scripts/check-github-run.sh"

[tasks."release:public-check"]
description = "Verify a selected run against GitHub Release state and asset digests"
run = "./scripts/check-github-release.sh"

[tasks."release:homebrew-promote"]
description = "Promote one verified published release formula to the Homebrew tap"
run = "./scripts/promote-homebrew.sh"

[tasks."release:test"]
description = "Exercise native packaging and the fail-closed Homebrew promotion stage"
run = [
  "./scripts/test-release-tooling.sh",
  "./scripts/test-homebrew-promotion.sh",
]

[tasks."mutants:full"]
description = "Run the full mutation suite for deep CI"
run = "cargo mutants --workspace --output target/mutants-full"
