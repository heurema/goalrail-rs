server {
    listen 80;
    server_name _;

    root /srv/goalrail;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 512;

    location ~ \.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /gr_site.wasm {
        types {
            application/wasm wasm;
        }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /status.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
